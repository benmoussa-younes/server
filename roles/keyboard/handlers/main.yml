---
- name: Apply the console keymap
  ansible.builtin.command:
    cmd: setupcon --force
  changed_when: true

- name: Rebuild the bootloader configuration
  ansible.builtin.command:
    cmd: update-grub
  changed_when: true
  when: not ansible_check_mode

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
