---
- name: The console-setup package is present
  ansible.builtin.apt:
    name: console-setup
    state: present
    cache_valid_time: 3600
  # Installed here, non-interactively: configured interactively,
  # keyboard-configuration runs its config script with a frontend that asks a
  # locale-dependent `variant` question and blocks.

- name: The keyboard layout is declared
  ansible.builtin.template:
    src: keyboard.j2
    dest: /etc/default/keyboard
    owner: root
    group: root
    mode: "0644"
  notify: Apply the console keymap

# The GRUB menu is drawn before the kernel exists, so it needs its own copy of
# the layout: a table in GRUB's `.gkb` format, loaded by a script that
# grub-mkconfig reads before any menu entry.
- name: The GRUB keymap directory exists
  ansible.builtin.file:
    path: "{{ keyboard_grub_keymap_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: keyboard_layout | length > 0

- name: GRUB's keyboard layout is compiled
  ansible.builtin.command:
    cmd: >-
      grub-kbdcomp -o {{ keyboard_grub_keymap }}
      {{ keyboard_layout }} {{ keyboard_variant }}
    creates: "{{ keyboard_grub_keymap }}"
  when: keyboard_layout | length > 0

# `keyboard_grub_keymap` carries the variant, so a changed variant compiles a
# NEW file: without this, the previous variant stays beside it. The files are
# generated by this role's own `grub-kbdcomp`, not owned by a package, and the
# directory is the role's; the current declaration keeps only the keymap it
# names.
- name: The GRUB keymap directory is read
  ansible.builtin.stat:
    path: "{{ keyboard_grub_keymap_dir }}"
  register: keyboard_grub_keymap_dir_stat

- name: The GRUB keymaps already present are listed
  ansible.builtin.find:
    paths: "{{ keyboard_grub_keymap_dir }}"
    patterns: "*.gkb"
    file_type: file
  register: keyboard_grub_keymaps
  when: keyboard_grub_keymap_dir_stat.stat.exists

- name: A GRUB keymap the current declaration no longer names is removed
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  vars:
    keyboard_grub_keymaps_keep: >-
      {{ [keyboard_grub_keymap] if keyboard_layout | length > 0 else [] }}
  loop: >-
    {{ keyboard_grub_keymaps.files | default([]) | map(attribute='path')
       | difference(keyboard_grub_keymaps_keep) | list }}
  loop_control:
    label: "{{ item | basename }}"
  when: keyboard_grub_keymap_dir_stat.stat.exists

- name: GRUB loads the declared keyboard layout
  ansible.builtin.template:
    src: 05_keymap.j2
    dest: "{{ keyboard_grub_script }}"
    owner: root
    group: root
    mode: "0755"
  when: keyboard_layout | length > 0
  notify: Rebuild the bootloader configuration

- name: A GRUB keymap script this role no longer declares is removed
  ansible.builtin.file:
    path: "{{ keyboard_grub_script }}"
    state: absent
  when: keyboard_layout | length == 0
  notify: Rebuild the bootloader configuration

- name: The console keymap is applied now
  ansible.builtin.meta: flush_handlers

# The proof is a `find` on the directory after the menu was regenerated: the
# only `.gkb` left is the one this declaration names. A second converge finds
# the same single file and changes nothing.
- name: The GRUB keymaps the current declaration leaves are read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: >-
      find {{ keyboard_grub_keymap_dir }} -maxdepth 1 -type f
      -name '*.gkb' -printf '%f\n'
  register: keyboard_grub_keymaps_after
  changed_when: false
  check_mode: false
  when:
    - not ansible_check_mode
    - keyboard_grub_keymap_dir_stat.stat.exists

- name: The GRUB keymap directory holds only the declared keymap
  ansible.builtin.assert:
    that:
      - >-
        (keyboard_grub_keymaps_after.stdout_lines | default([]) | sort)
        == (([keyboard_grub_keymap | basename]
              if keyboard_layout | length > 0 else []) | sort)
    fail_msg: >-
      {{ inventory_hostname }}: {{ keyboard_grub_keymap_dir }} holds
      {{ keyboard_grub_keymaps_after.stdout_lines | default([]) | join(', ') }}
      (or nothing); the current declaration names
      {{ (keyboard_grub_keymap | basename) if keyboard_layout | length > 0
         else 'no keymap' }}.
  when:
    - not ansible_check_mode
    - keyboard_grub_keymap_dir_stat.stat.exists

# The font has to survive `fbcon` taking over the new framebuffer. The drop-in
# orders console-setup after `systemd-udev-settle.service`, which waits for the
# udev queue; the `dev-dri-card0.device` dependency of an earlier release timed out because
# Debian does not tag DRM devices with `systemd`.
- name: The console-setup drop-in directory exists
  ansible.builtin.file:
    path: "{{ keyboard_console_setup_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The console-setup unit waits for the DRM device
  ansible.builtin.template:
    src: console-setup-drm.conf.j2
    dest: "{{ keyboard_console_setup_dropin }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# `console-setup` owns the console on Debian. The systemd path is inert:
# `systemd-vconsole-setup` is absent and `/etc/vconsole.conf` is Debian's
# tmpfiles symlink to `/etc/default/keyboard`. The product removes it now, and a
# unit after Debian's tmpfiles removes it again at every boot.
- name: The inert /etc/vconsole.conf is removed now
  ansible.builtin.file:
    path: "{{ keyboard_vconsole_conf }}"
    state: absent

- name: The console removal unit is installed
  ansible.builtin.template:
    src: server-vconsole-remove.service.j2
    dest: "{{ keyboard_vconsole_remove_service }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# The first implementation used a link unit. It is not this role's declaration
# any more; stop it and remove it so it cannot recreate the path at boot.
- name: A superseded vconsole link unit is disabled and stopped
  ansible.builtin.systemd_service:
    name: server-vconsole-link.service
    enabled: false
    state: stopped
  failed_when: false
  when: not ansible_check_mode

- name: A superseded vconsole link unit is removed
  ansible.builtin.file:
    path: /etc/systemd/system/server-vconsole-link.service
    state: absent
  notify: Reload systemd

- name: A superseded vconsole tmpfiles entry is removed
  ansible.builtin.file:
    path: /etc/tmpfiles.d/zz-server-vconsole.conf
    state: absent

- name: A superseded product vconsole declaration is removed
  ansible.builtin.file:
    path: /etc/server/vconsole.conf
    state: absent

- name: The console removal unit is applied now
  ansible.builtin.systemd_service:
    name: "{{ keyboard_vconsole_remove_service | basename }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: The console font and vconsole state are applied now
  ansible.builtin.meta: flush_handlers
