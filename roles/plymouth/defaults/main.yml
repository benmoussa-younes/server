---
# The boot splash.
#
# A server boots to a console, and the screen between GRUB and the login prompt
# belongs to the product. The theme is built from this product's own `assets/`
# (never from the workstation's), selected with `plymouth-set-default-theme`,
# compiled into the initramfs, and read back from what the boot reads.

# The theme compiled into the initramfs and started by `plymouthd`.
plymouth_theme_name: server
plymouth_theme_source: "{{ role_path }}/../../assets/branding/theme/server"
plymouth_theme_dir: /usr/share/plymouth/themes/server

# The package that CONFIGURES the splash: `plymouth-set-default-theme` and the
# initramfs hook live here. The theme files alone are inert.
plymouth_package: plymouth

# The distribution's theme collection is NOT installed on a server: the splash
# is this product's, and every extra package is a package to patch.
plymouth_install_themes: false
plymouth_themes_package: plymouth-themes

# The tool that reads the selected theme and the one that rebuilds the
# initramfs.
plymouth_default_theme_tool: /usr/sbin/plymouth-set-default-theme
plymouth_update_initramfs: /usr/sbin/update-initramfs

# Where the selection is stored; read back at the end of the run.
plymouth_selection_file: /etc/plymouth/plymouthd.conf

# The kernel command line must carry `splash`, or `plymouthd` never shows the
# theme. `hardening` owns `/etc/default/grub` and declares it; this role reads
# it and refuses a host where it is missing, instead of editing GRUB twice.
plymouth_required_cmdline_option: splash
plymouth_grub_default: /etc/default/grub
plymouth_initramfs_tool: /usr/bin/lsinitramfs
