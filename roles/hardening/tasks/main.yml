---
- name: The kernel settings are declared
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: "{{ hardening_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply the kernel settings

# A sysctl file this role does not declare wins any key it shares: `sysctl
# --system` reads the directory in NAME order, so a `99-` file left by another
# tool silently overrides `50-performance.conf` and `60-hardening.conf`.
# Measured on a converted machine (2026-10-20). The declaration is the
# whole policy, so anything else is retired -- renamed, never deleted.
- name: The sysctl declarations already present are listed
  # `*.conf` only: the distribution's `README.sysctl` is documentation, and a
  # file without that suffix is not read by `sysctl --system` at all.
  ansible.builtin.find:
    paths: "{{ hardening_sysctl_file | dirname }}"
    patterns: "*.conf"
    file_type: file
  register: hardening_sysctl_existing

- name: The declarations this role and the tuning role own are known
  # Three files the product writes share the directory; any other file must be
  # named by the site (`hardening_sysctl_kept`) or it is retired. The tuning
  # role owns BOTH `50-performance.conf` (vm.*) and
  # `51-performance-network.conf` (net.*): the network tuning is a performance
  # declaration, not a hardening one, and the split keeps the security file
  # owning its own namespace.
  ansible.builtin.set_fact:
    hardening_sysctl_declared: >-
      {{ [hardening_sysctl_file,
          (hardening_sysctl_file | dirname) ~ '/50-performance.conf',
          (hardening_sysctl_file | dirname) ~ '/51-performance-network.conf',
          (hardening_sysctl_file | dirname) ~ '/62-podman-userns.conf']
         + hardening_sysctl_kept }}

# Only a file NO PACKAGE owns is retired: a distribution drop-in is not this
# role's to remove, and a package would restore it on its next upgrade.
- name: The sysctl declarations are attached to a package, or not
  ansible.builtin.command:
    cmd: dpkg-query -S {{ item }}
  loop: >-
    {{ hardening_sysctl_existing.files | map(attribute='path')
       | reject('search', '\.retired-')
       | reject('in', hardening_sysctl_declared)
       | list }}
  loop_control:
    label: "{{ item | basename }}"
  register: hardening_sysctl_owner
  changed_when: false
  failed_when: false

- name: The sysctl declarations no package owns are retired
  ansible.builtin.command:
    cmd: >-
      mv {{ item.item }} {{ item.item }}.retired-{{ ansible_date_time.date }}
  loop: "{{ hardening_sysctl_owner.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item | basename }}"
  changed_when: true
  notify: Apply the kernel settings

- name: The kernel settings are applied now
  ansible.builtin.meta: flush_handlers

# The declaration is not the policy: the RUNNING kernel is. Debian reads
# `/etc/sysctl.conf` last, and a package drop-in can win a key this file
# declares. Every declared pair is therefore read back from `/proc/sys` through
# `sysctl -n`, and a value the kernel did not take fails the run.
- name: The declared kernel settings are read from the file
  ansible.builtin.slurp:
    src: "{{ hardening_sysctl_file }}"
  register: hardening_sysctl_content
  when: not ansible_check_mode

- name: The declared kernel settings are listed as pairs
  ansible.builtin.set_fact:
    hardening_sysctl_pairs: >-
      {{ (hardening_sysctl_content.content | b64decode)
         | regex_findall('(?m)^([a-z0-9_-]+(?:\.[a-z0-9_-]+)+)\s*=\s*(\S.*)$') }}
  when: not ansible_check_mode

- name: The running kernel is asked for each declared key
  ansible.builtin.command:
    cmd: sysctl -n {{ item.0 }}
  loop: "{{ hardening_sysctl_pairs }}"
  loop_control:
    label: "{{ item.0 }}"
  register: hardening_sysctl_running
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Every declared kernel setting is in force
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout_lines | length > 0
      - (item.stdout_lines | map('trim') | unique | list) == [item.item.1 | trim]
    fail_msg: >-
      {{ item.item.0 }} is {{ item.stdout | trim | default('absent', true) }}
      in the running kernel, not {{ item.item.1 | trim }}.
  loop: "{{ hardening_sysctl_running.results }}"
  loop_control:
    label: "{{ item.item.0 }}"
  when: not ansible_check_mode

# The wildcard pair is not a key `sysctl -n` can read (it names no interface),
# and the generic loop deliberately skips it. The running kernel is read with
# the same expansion `sysctl --system` applied: every interface, present and
# future. `all` alone is exactly the defect SEC-01 removed.
- name: The per-interface anti-spoofing values are read from the running kernel
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -a -r '^net\.ipv4\.conf\..*\.rp_filter$'
  register: hardening_rp_filter_running
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: Every interface validates strictly
  ansible.builtin.assert:
    that:
      - hardening_rp_filter_running.stdout_lines | length > 0
      - (hardening_rp_filter_running.stdout_lines
         | reject('search', '= 1$') | list) | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: an interface is not in strict reverse-path
      mode: {{ hardening_rp_filter_running.stdout_lines
                | reject('search', '= 1$') | join(', ') }}.
  when: not ansible_check_mode

# The CPU vendor decides which microcode package carries the blob. It is read
# from /proc/cpuinfo rather than from a site value: the machine knows its CPU.
- name: The CPU vendor is read
  ansible.builtin.command:
    cmd: grep -m1 '^vendor_id' /proc/cpuinfo
  register: hardening_cpu_vendor_raw
  changed_when: false
  check_mode: false
  failed_when: false
  when: hardening_microcode | bool

- name: The CPU vendor is known
  ansible.builtin.set_fact:
    hardening_cpu_vendor: >-
      {{ hardening_cpu_vendor_raw.stdout | default('')
         | regex_findall('vendor_id\s*:\s*(\S+)') | first | default('') }}
  when: hardening_microcode | bool

- name: The microcode package for this CPU is known
  ansible.builtin.set_fact:
    hardening_microcode_package: >-
      {{ hardening_microcode_packages[hardening_cpu_vendor] | default('') }}
  when: hardening_microcode | bool

- name: The vendor microcode package is installed
  ansible.builtin.apt:
    name: "{{ hardening_microcode_package }}"
    state: present
    cache_valid_time: 3600
  when:
    - hardening_microcode | bool
    - hardening_microcode_package | length > 0

# The package's postinst usually rebuilds the initramfs, but a machine whose
# initramfs was built before the package arrived keeps a boot image without
# the early microcode: the CPU then runs the firmware revision, and a mitigation
# that depends on the blob reports "no microcode" (measured on the depot,
# 2026-10-26). The declaration is the BLOB IN THE INITRAMFS, not the package.
- name: The initramfs contents are read
  ansible.builtin.command:
    cmd: lsinitramfs /boot/initrd.img-{{ ansible_kernel }}
  register: hardening_microcode_initramfs
  changed_when: false
  check_mode: false
  failed_when: false
  when: hardening_microcode | bool

- name: The initramfs is rebuilt when it has no microcode
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  register: hardening_microcode_rebuild
  changed_when: true
  when:
    - hardening_microcode | bool
    - not ansible_check_mode
    - hardening_microcode_initramfs_path not in (hardening_microcode_initramfs.stdout | default(''))

- name: The initramfs contents are read after the rebuild
  ansible.builtin.command:
    cmd: lsinitramfs /boot/initrd.img-{{ ansible_kernel }}
  register: hardening_microcode_initramfs_after
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - hardening_microcode | bool
    - hardening_microcode_rebuild is changed

- name: The initramfs carries the early microcode
  ansible.builtin.assert:
    that:
      - >-
        hardening_microcode_initramfs_path in
        (hardening_microcode_initramfs_after.stdout
         | default(hardening_microcode_initramfs.stdout | default('')))
    fail_msg: >-
      {{ inventory_hostname }}: the initramfs for {{ ansible_kernel }} does not
      carry {{ hardening_microcode_initramfs_path }}. The CPU will boot with the
      firmware revision whatever the package says. Check `lsinitramfs` and the
      package's initramfs hook.
  when:
    - hardening_microcode | bool
    - not ansible_check_mode

- name: The loaded microcode revision is read
  ansible.builtin.command:
    cmd: grep -m1 '^microcode' /proc/cpuinfo
  register: hardening_microcode_loaded
  changed_when: false
  check_mode: false
  failed_when: false
  when: hardening_microcode | bool

- name: A reboot is required when the early load has not happened yet
  ansible.builtin.debug:
    msg: >-
      microcode is {{ hardening_microcode_loaded.stdout | default('absent') }}
      in this boot; the initramfs now carries the blob, so the next reboot is
      where the early load takes effect. The audit reads the result after it.
  when:
    - hardening_microcode | bool
    - not ansible_check_mode
    - >-
      (hardening_microcode_loaded.stdout | default('')
       | regex_findall('microcode\s*:\s*(\S+)') | first | default('0')) in ['0', '']


- name: The audit trail and post-upgrade restarts are installed
  ansible.builtin.apt:
    name:
      - auditd
      - needrestart
    state: present
    cache_valid_time: 3600

- name: The post-upgrade restart policy is declared
  ansible.builtin.template:
    src: needrestart.conf.j2
    dest: "{{ hardening_needrestart_conf }}"
    owner: root
    group: root
    mode: "0644"

# The package is installed by the task above, so the unit exists on a real
# run -- but not in check mode, where the install is only reported.
- name: The audit trail runs
  ansible.builtin.systemd_service:
    name: auditd
    state: started
    enabled: true
  when: not ansible_check_mode

# Debian ships `auditd` with an EMPTY ruleset: it logs PAM session events and
# audits nothing else. This product declares what it wants audited, in `rules.d`
# (the package's own file carries the control directives).
- name: The audit rules are declared
  ansible.builtin.template:
    src: audit-hardening.rules.j2
    dest: "{{ hardening_audit_rules_file }}"
    owner: root
    group: root
    mode: "0640"
  notify: Reload the audit rules

# `augenrules` merges EVERY file in `rules.d`, so a rule set left by another
# product is part of this host's policy without anyone declaring it. Found on
# the first real apply: a second file declared the same watches, the merged
# policy carried each one twice, and the load failed with "Rule exists".
# The declaration is the whole policy, so anything else is retired -- renamed,
# not deleted, so it can be read back.
- name: The audit rules directory is known
  ansible.builtin.stat:
    path: "{{ hardening_audit_rules_file | dirname }}"
  register: hardening_audit_rules_state

- name: The undeclared audit rule files are found
  ansible.builtin.find:
    paths: "{{ hardening_audit_rules_file | dirname }}"
    patterns: "*.rules"
  register: hardening_audit_rule_files
  when: hardening_audit_rules_state.stat.isdir | default(false)

# `audit.rules` is the DISTRIBUTION's file and it is NOT retired: it carries the
# control directives (`-D`, `-b`, `--backlog_wait_time`, `-f`) that `augenrules`
# puts at the head of the merged file. Without its `-D`, a load ADDS the rules
# to the running set instead of replacing it, and the second converge fails with
# `Rule exists` -- measured on a converted machine (2026-10-20), after this role
# had retired the distribution's file as "undeclared".
#
# So the rule is: the distribution's `audit.rules` stays, this role's own file
# stays, and everything else is retired.
- name: The audit rule files this role does not declare are retired
  ansible.builtin.command:
    cmd: mv {{ item }} {{ item }}.retired-{{ ansible_date_time.date }}
  loop: >-
    {{ hardening_audit_rule_files.files | default([]) | map(attribute='path')
       | reject('search', '\.retired-|\.disabled-')
       | reject('in', [hardening_audit_rules_file,
                       (hardening_audit_rules_file | dirname) ~ '/audit.rules'])
       | list }}
  loop_control:
    label: "{{ item }}"
  changed_when: true
  notify: Reload the audit rules

# The log bound, declared rather than inherited (Debian's default is 8 MB x 5).
# `create: true` because on a fresh machine the package is installed by the
# task above but a `--check` run only SIMULATES that install: the conffile
# does not exist yet, and `lineinfile` without `create` fails on the absent
# file even in check mode (measured on the bench host, 2026-10-21).
- name: The audit log is bounded
  ansible.builtin.lineinfile:
    path: "{{ hardening_audit_conf }}"
    regexp: "^\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    create: true
    owner: root
    group: root
    mode: "0640"
  loop:
    - { key: max_log_file, value: "{{ hardening_audit_max_log_file }}" }
    - { key: num_logs, value: "{{ hardening_audit_num_logs }}" }
    - { key: max_log_file_action, value: "{{ hardening_audit_max_log_file_action }}" }
  notify: Restart auditd

- name: The audit rules and settings are applied now
  ansible.builtin.meta: flush_handlers

# Unprivileged user namespaces. Debian ships the profile in
# complain mode, so it only logs; `aa-enforce` makes it bite. `apparmor-utils`
# (the tool) comes from `common`.
- name: The userns profile mode is read
  ansible.builtin.command:
    cmd: grep -c 'flags=(complain)' {{ hardening_userns_profile }}
  register: hardening_userns_complain
  changed_when: false
  failed_when: false

- name: Unprivileged user namespaces are confined
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: "{{ hardening_userns_tool }} {{ hardening_userns_profile }}"
  when: hardening_userns_complain.stdout | int > 0
  changed_when: true

# The kernel command line. Declared here; it takes effect at the
# next reboot, which is the operator's. `update-grub` rewrites
# the bootloader config.
#
# The mode decides whether the declaration REPLACES the line or ADDS to it. In
# append mode the file as installed is the starting point: the task reads the
# line, keeps every option it does not own, and appends the missing ones. The
# comparison is by key, so `quiet` is not appended when `quiet` is already there
# and `init_on_alloc=1` is not doubled by a different spelling.
- name: The current kernel command line is read
  ansible.builtin.slurp:
    src: "{{ hardening_grub_default }}"
  register: hardening_grub_read

- name: The declared kernel options are computed
  ansible.builtin.set_fact:
    hardening_cmdline_effective: >-
      {%- if hardening_cmdline_mode == 'replace' -%}
      {{ hardening_kernel_cmdline }}
      {%- else -%}
      {%- set existing =
            (hardening_grub_read.content | default('') | b64decode
             | regex_findall('GRUB_CMDLINE_LINUX_DEFAULT="([^"]*)"')
             | first | default('') | split) -%}
      {#- Compare by KEY. Comparing whole tokens let `init_on_alloc=1` be
          appended after an existing `init_on_alloc=0`: the line then carried
          two values for one key and the kernel kept whichever it read last. -#}
      {%- set declared_keys =
            hardening_kernel_cmdline | map('regex_replace', '=.*$', '') | list -%}
      {#- A `set` inside a `for` is scoped to the loop; the namespace is what
          survives it. Without it every existing option was discarded. -#}
      {%- set ns = namespace(kept=[]) -%}
      {%- for token in existing -%}
      {%-   set token_key = token | regex_replace('=.*$', '') -%}
      {%-   if token_key not in declared_keys -%}
      {%-     set ns.kept = ns.kept + [token] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.kept + hardening_kernel_cmdline }}
      {%- endif -%}

- name: The declared command line carries one value per key
  ansible.builtin.assert:
    that:
      - >-
        (hardening_cmdline_effective | map('regex_replace', '=.*$', '') | list | length)
        == (hardening_cmdline_effective | map('regex_replace', '=.*$', '') | unique | list | length)
    fail_msg: >-
      {{ hardening_kernel_cmdline }} declares the same key twice, or collides
      with an option already on the line.

- name: The kernel command line is declared
  ansible.builtin.lineinfile:
    path: "{{ hardening_grub_default }}"
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="{{ hardening_cmdline_effective | unique | join(" ") }}"'
    owner: root
    group: root
    mode: "0644"
  notify: Update grub

# The menu title is the product's name, not a distribution label. Debian's
# `10_linux` appends ` GNU/Linux` to `GRUB_DISTRIBUTOR`; day 0 or the site sets
# that key to the product's name, and this role does not write it. The script is
# Debian's conffile; the literal line is replaced on every converge, and
# `update-grub` rebuilds the title from the distributor. `/etc/default/grub` is
# NOT touched: `GRUB_CMDLINE_LINUX_DEFAULT` above is the only key this role
# owns.
#
# The readback is what proves the change: if Debian rewrites the line, the
# replace stops matching and the assertion below fails instead of passing
# silently.
- name: The boot menu does not append GNU/Linux to the product name
  ansible.builtin.replace:
    path: "{{ hardening_grub_script }}"
    regexp: 'OS="\$\{GRUB_DISTRIBUTOR\} GNU/Linux"'
    replace: 'OS="${GRUB_DISTRIBUTOR}"'
  notify: Update grub

- name: The boot menu is regenerated before it is read back
  # Both declarations above notify the same handler; flushing here makes
  # `update-grub` read the final `/etc/default/grub` and the patched script.
  ansible.builtin.meta: flush_handlers

- name: The boot menu title is read back
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: grep -c GNU/Linux /boot/grub/grub.cfg
  register: hardening_boot_menu
  changed_when: false
  check_mode: false
  failed_when: false
  when: not ansible_check_mode

- name: The boot menu names no distribution suffix
  ansible.builtin.assert:
    that:
      - (hardening_boot_menu.rc | default(2) | int) in [0, 1]
      - hardening_boot_menu.stdout | default('') | trim | int == 0
    fail_msg: >-
      {{ inventory_hostname }}: /boot/grub/grub.cfg still contains
      `GNU/Linux` (`{{ hardening_boot_menu.stdout | default('no count') }}`
      line(s), grep rc {{ hardening_boot_menu.rc | default('none') }}). The
      replace in {{ hardening_grub_script }} did not apply: Debian may have
      changed its title line. Read `grep -n GNU/Linux
      {{ hardening_grub_script }}` and `grep -n GNU/Linux
      /boot/grub/grub.cfg`.
  when: not ansible_check_mode

# Mount hardening: /tmp and /dev/shm are world-writable, so nothing there may
# be executed.
#
# The options a mount ACCEPTS depend on its filesystem: `size=`, `nr_inodes=`
# and `mode=` exist on tmpfs and nowhere else. This role used to write them
# unconditionally into a `tmp.mount` drop-in; on a machine whose `/tmp` is its
# own ext4 partition systemd then failed the mount, and with it
# `local-fs.target`, and the machine booted to emergency mode (measured on
# the bench host, 2026-10-21). The declaration is therefore built from what the
# mount actually is.
- name: The /tmp mount point is read
  # A pure READ: it runs in check mode too, so the tasks below can decide.
  ansible.builtin.command:
    cmd: findmnt -no TARGET /tmp
  register: hardening_tmp_target
  changed_when: false
  check_mode: false

- name: The /tmp filesystem and its options are read
  ansible.builtin.command:
    cmd: findmnt -no FSTYPE,OPTIONS /tmp
  register: hardening_tmp_mount
  changed_when: false
  check_mode: false

- name: The /tmp mount drop-in directory exists
  ansible.builtin.file:
    path: "{{ hardening_tmp_mount_dropin | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: hardening_tmp_target.stdout == '/tmp'

# A drop-in exists only for a mount OF ITS OWN: systemd applies it to the
# `tmp.mount` generated from `fstab`, and `Options=` there REPLACES the
# installer's list. It must therefore carry the list that filesystem can take,
# plus the hardening keys -- never tmpfs keys on a disk.
- name: The /tmp mount is declared noexec
  ansible.builtin.copy:
    content: "[Mount]\nOptions={{ hardening_tmp_effective_options }}\n"
    dest: "{{ hardening_tmp_mount_dropin }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    hardening_tmp_fstype: "{{ hardening_tmp_mount.stdout.split()[0] | default('') }}"
    hardening_tmp_current_options: "{{ hardening_tmp_mount.stdout.split()[1] | default('') }}"
    hardening_tmp_effective_options: >-
      {{ ((hardening_tmp_mount_options.split(',')
           if hardening_tmp_fstype == 'tmpfs'
           else (hardening_tmp_current_options.split(',')))
          + ['nosuid', 'nodev', 'noexec'])
         | unique | join(',') }}
  when: hardening_tmp_target.stdout == '/tmp'
  notify: Reload systemd

# A `/tmp` that shares the root filesystem is not a mount: a drop-in would
# describe a mount that does not exist, and a remount would set the option on
# `/` itself (`mount -o remount,noexec /tmp` makes the whole root noexec).
- name: A /tmp drop-in this role no longer has a mount for is retired
  ansible.builtin.file:
    path: "{{ hardening_tmp_mount_dropin }}"
    state: absent
  when: hardening_tmp_target.stdout != '/tmp'
  notify: Reload systemd

- name: /dev/shm is declared noexec
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^tmpfs\s+/dev/shm\s'
    line: "tmpfs /dev/shm tmpfs {{ hardening_shm_mount_options }} 0 0"
    state: present
  notify: Reload systemd

- name: /tmp is not executable
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: mount -o remount,nosuid,nodev,noexec /tmp
  when:
    - hardening_tmp_target.stdout == '/tmp'
    - "'noexec' not in hardening_tmp_mount.stdout"
  changed_when: true

- name: The /dev/shm mount options are read
  ansible.builtin.command:
    cmd: findmnt -no OPTIONS /dev/shm
  register: hardening_shm_opts
  changed_when: false

- name: /dev/shm is not executable
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: mount -o remount,nosuid,nodev,noexec /dev/shm
  when: "'noexec' not in hardening_shm_opts.stdout"
  changed_when: true

# Resource limits: a declared base, not a guess per service.
- name: The resource limits directory exists
  ansible.builtin.file:
    path: "{{ hardening_limits_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The base resource limits are declared
  ansible.builtin.template:
    src: limits-server.conf.j2
    dest: "{{ hardening_limits_file }}"
    owner: root
    group: root
    mode: "0644"

# Two files in `limits.d` with the same `*` domain do not conflict visibly: pam
# applies each line, and a later soft/hard pair replaces an earlier one without
# a word. A file this role does not declare is therefore retired, as in
# `sysctl.d` and `sshd_config.d`.
- name: The resource-limit declarations already present are listed
  ansible.builtin.find:
    paths: "{{ hardening_limits_file | dirname }}"
    patterns: "*.conf"
    file_type: file
  register: hardening_limits_existing

# Only a file NO PACKAGE owns is retired. `10-coredump-debian.conf` (systemd) and
# `25-pw-rlimits.conf` (pipewire) are the distribution's, and removing them would
# fight a package on its next upgrade; a file left by another engine is owned by
# nobody and is exactly what must go.
- name: The resource-limit declarations are attached to a package, or not
  ansible.builtin.command:
    cmd: dpkg-query -S {{ item }}
  loop: >-
    {{ hardening_limits_existing.files | map(attribute='path')
       | reject('search', '\.retired-')
       | reject('equalto', hardening_limits_file)
       | list }}
  loop_control:
    label: "{{ item | basename }}"
  register: hardening_limits_owner
  changed_when: false
  failed_when: false

- name: The resource-limit declarations no package owns are retired
  ansible.builtin.command:
    cmd: >-
      mv {{ item.item }} {{ item.item }}.retired-{{ ansible_date_time.date }}
  loop: "{{ hardening_limits_owner.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item | basename }}"
  changed_when: true

- name: The systemd limits directory exists
  ansible.builtin.file:
    path: "{{ hardening_system_limits_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The services' base limit is declared
  ansible.builtin.template:
    src: system-limits.conf.j2
    dest: "{{ hardening_system_limits_file }}"
    owner: root
    group: root
    mode: "0644"

# The reboot policy: a security kernel is installed, and the
# machine is never rebooted on its own -- but it says when a reboot is pending.
- name: The reboot check is in place
  ansible.builtin.template:
    src: reboot-check.sh.j2
    dest: "{{ hardening_reboot_check_script }}"
    owner: root
    group: root
    mode: "0755"

- name: The reboot check units are in place
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - server-reboot-check.service
    - server-reboot-check.timer
  notify: Reload systemd

- name: The reboot check units are loaded before they are started
  ansible.builtin.meta: flush_handlers

- name: The reboot check runs daily
  ansible.builtin.systemd_service:
    name: server-reboot-check.timer
    enabled: true
    state: started
  # The units above are written, not installed, in check mode: naming a unit
  # that systemd does not know yet fails the whole check run.
  when: not ansible_check_mode

- name: Unused subsystems are prevented from loading
  ansible.builtin.template:
    src: modprobe-hardening.conf.j2
    dest: /etc/modprobe.d/60-hardening.conf
    owner: root
    group: root
    mode: "0644"

# The disk monitor is declared, not inherited: `smartd` reads this file at
# start. The service is restarted by the handler below, because a changed
# schedule that the running daemon never reads is a declaration that does
# nothing until the next boot.
- name: The product's disk monitor schedule is installed
  ansible.builtin.copy:
    src: smartd.conf
    dest: "{{ hardening_smartd_conf }}"
    owner: root
    group: root
    mode: "0644"
  when: hardening_smartd_manage | bool
  notify: Restart the disk monitor

- name: The default target is the server target
  ansible.builtin.command:
    cmd: systemctl set-default multi-user.target
  register: hardening_target
  changed_when: "'Created symlink' in hardening_target.stdout"

# A coredump can carry a password, a key or a token. The machine does not keep
# one: `Storage=none` disables the store and `ProcessSizeMax=0` stops the dump
# before it is written. This is a declaration of the host, not of a service.
- name: The coredump directory exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: The coredump store is disabled
  ansible.builtin.copy:
    content: |
      # Managed by Ansible; do not edit.
      # SPDX-License-Identifier: AGPL-3.0-or-later
      [Coredump]
      Storage=none
      ProcessSizeMax=0
    dest: /etc/systemd/coredump.conf.d/50-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: The coredump configuration is applied now
  ansible.builtin.meta: flush_handlers

- name: The effective coredump configuration is read
  ansible.builtin.command:
    cmd: systemd-analyze cat-config systemd/coredump.conf
  register: hardening_coredump_effective
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

- name: The coredump store is really disabled
  ansible.builtin.assert:
    that:
      - "'Storage=none' in hardening_coredump_effective.stdout"
    fail_msg: >-
      {{ inventory_hostname }}: the effective coredump configuration does not
      say `Storage=none`; the drop-in is not read or another file wins.
  when: not ansible_check_mode
