---
# A read-only audit. Every task reads; none writes a setting. The report says
# what the machine does, not what a role intended.

- name: The host uses systemd
  ansible.builtin.assert:
    that:
      - ansible_facts.service_mgr == 'systemd'
    fail_msg: "{{ inventory_hostname }} does not use systemd."

- name: The effective sshd configuration is read
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: audit_sshd
  changed_when: false
  check_mode: false
  failed_when: false

- name: The kernel command line is read
  ansible.builtin.command:
    cmd: cat /proc/cmdline
  register: audit_cmdline
  changed_when: false
  check_mode: false

- name: The loaded firewall is read
  ansible.builtin.command:
    cmd: nft list table inet {{ security_firewall_table | default('server') }}
  register: audit_nft
  changed_when: false
  check_mode: false
  failed_when: false

- name: The declared kernel values are read
  ansible.builtin.command:
    cmd: >-
      sysctl -n kernel.kptr_restrict
      kernel.yama.ptrace_scope net.ipv4.conf.default.log_martians
      kernel.io_uring_disabled
  register: audit_sysctl
  changed_when: false
  check_mode: false
  failed_when: false

# The kernel validates with the maximum of `all` and the interface, so reading
# `all` alone is the defect this control exists to remove (SEC-01). Every
# interface is read, present and future.
- name: The per-interface anti-spoofing values are read
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl -a -r '^net\.ipv4\.conf\..*\.rp_filter$'
  register: audit_rp_filter
  changed_when: false
  check_mode: false
  failed_when: false

- name: The IPv6 state and its listeners are read
  ansible.builtin.command:
    cmd: >-
      sh -c 'printf "%s " "$(cat /proc/sys/net/ipv6/conf/all/disable_ipv6)";
      printf "%s\n" "$(cat /proc/sys/net/ipv6/conf/default/disable_ipv6)"'
  register: audit_ipv6
  changed_when: false
  check_mode: false
  failed_when: false

- name: The IPv6 listeners are read
  ansible.builtin.command:
    cmd: ss -H -lntu
  register: audit_listeners
  changed_when: false
  check_mode: false
  failed_when: false

# A socket bound to `[::]` is a mechanism; reachability is the result. With
# `disable_ipv6=1` the kernel keeps no IPv6 address and no IPv6 route, so the
# listener cannot be reached. The distinction matters: an earlier reading
# treated the socket itself as the policy.
- name: The IPv6 reachability is read
  ansible.builtin.command:
    cmd: sh -c 'ip -6 addr show scope global; ip -6 route show default'
  register: audit_ipv6_reach
  changed_when: false
  check_mode: false
  failed_when: false


- name: The loaded microcode and the CPU vulnerability line are read
  ansible.builtin.command:
    cmd: >-
      sh -c 'grep -m1 "^microcode" /proc/cpuinfo;
      cat /sys/devices/system/cpu/vulnerabilities/tsa 2>/dev/null || true'
  register: audit_microcode
  changed_when: false
  check_mode: false
  failed_when: false

- name: The initramfs microcode blob is read
  ansible.builtin.command:
    cmd: lsinitramfs /boot/initrd.img-{{ ansible_kernel }}
  register: audit_initramfs
  changed_when: false
  check_mode: false
  failed_when: false

- name: The audit trail is read with its file named
  # `aureport --summary` alone reads nothing on Debian (measured
  # 2026-10-26: 0 events while the file held 142 816 records). `--input` names
  # the file. `--start boot` is deliberately not used: aureport derives boot
  # time from uptime, and the time role moves the clock; a correct host could
  # report zero after an NTP step.
  ansible.builtin.command:
    cmd: >-
      aureport --input /var/log/audit/audit.log --summary
  register: audit_trail
  changed_when: false
  check_mode: false
  failed_when: false

- name: The nftables unit and its failsafe table are read
  ansible.builtin.command:
    cmd: >-
      sh -c 'systemctl is-active nftables.service 2>/dev/null || true;
      nft list table inet {{ security_firewall_table | default('server') }}-failsafe 2>/dev/null || true'
  register: audit_nft_service
  changed_when: false
  check_mode: false
  failed_when: false

- name: The product-owned file baseline is verified
  ansible.builtin.command:
    cmd: sha256sum -c {{ audit_manifest_file }}
  register: audit_manifest
  changed_when: false
  check_mode: false
  failed_when: false


- name: The human account's inactivity field is read
  ansible.builtin.command:
    cmd: getent shadow {{ audit_human_user }}
  register: audit_shadow
  changed_when: false
  check_mode: false
  failed_when: false
  when: audit_human_user | length > 0

- name: The systemd console declaration is read
  ansible.builtin.command:
    cmd: cat /etc/vconsole.conf
  register: audit_vconsole_content
  changed_when: false
  check_mode: false
  failed_when: false


# An absent file is a finding, not an abort: this role is the read-only audit,
# and a host the product has not converged yet must still produce a report that
# names the missing file. `failed_when: false` keeps the loop going and the
# extraction below reads an absent file as empty.
- name: The PAM stacks and the password policy are read
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/pam.d/common-auth
    - /etc/pam.d/common-password
    - /etc/security/pwquality.conf
    - /etc/login.defs
    - /etc/profile.d/90-server-env.sh
  register: audit_pam_files
  check_mode: false
  failed_when: false

- name: The effective coredump configuration is read
  ansible.builtin.command:
    cmd: systemd-analyze cat-config systemd/coredump.conf
  register: audit_coredump
  changed_when: false
  check_mode: false
  failed_when: false

- name: The installed packages are read
  ansible.builtin.package_facts:
    manager: auto

- name: The mounts that can execute are listed
  # A noexec mount cannot run a setuid binary, and a virtual or network mount
  # has no package-owned executable to census. The skipped mounts are reported
  # with their reason instead of being silently absent from the scan.
  ansible.builtin.set_fact:
    audit_suid_mounts: >-
      {{ ansible_mounts | default([])
         | rejectattr('fstype', 'in', audit_suid_scan_exclude_fstypes)
         | rejectattr('options', 'search', 'noexec')
         | map(attribute='mount') | list }}
    audit_suid_skipped: >-
      {{ (ansible_mounts | default([])
          | selectattr('fstype', 'in', audit_suid_scan_exclude_fstypes)
          | map(attribute='mount') | list)
         + (ansible_mounts | default([])
            | rejectattr('fstype', 'in', audit_suid_scan_exclude_fstypes)
            | selectattr('options', 'search', 'noexec')
            | map(attribute='mount') | list) }}

- name: The setuid and setgid files are listed on every executable mount
  ansible.builtin.command:
    cmd: find {{ item }} -xdev -type f \( -perm -4000 -o -perm -2000 \) -printf '%p\n'
  loop: "{{ audit_suid_mounts }}"
  loop_control:
    label: "{{ item }}"
  register: audit_suid_files
  changed_when: false
  check_mode: false
  failed_when: false

- name: The setuid and setgid paths are collected
  ansible.builtin.set_fact:
    audit_suid_paths: >-
      {{ audit_suid_files.results | default([])
         | map(attribute='stdout_lines') | flatten | list }}

- name: The setuid census scope is recorded
  ansible.builtin.set_fact:
    audit_suid_scope: >-
      {{ 'scanned ' ~ (audit_suid_mounts | join(', '))
         ~ ('; skipped ' ~ (audit_suid_skipped | join(', '))
            if audit_suid_skipped | length > 0 else '') }}

- name: The owning package of each setuid or setgid file is looked up
  ansible.builtin.command:
    cmd: dpkg-query -S {{ item }}
  loop: "{{ audit_suid_paths }}"
  loop_control:
    label: "{{ item }}"
  register: audit_suid_owner
  changed_when: false
  check_mode: false
  failed_when: false

- name: The account files are read
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { path: /etc/passwd, mode: "0644", owner: root, group: root }
    - { path: /etc/shadow, mode: "0640", owner: root, group: shadow }
    - { path: /etc/group, mode: "0644", owner: root, group: root }
    - { path: /etc/gshadow, mode: "0640", owner: root, group: shadow }
  register: audit_account_files

- name: The audit daemon state is read
  ansible.builtin.command:
    cmd: /usr/sbin/auditctl -s
  register: audit_daemon
  changed_when: false
  check_mode: false
  failed_when: false

- name: The loaded audit rules are read
  ansible.builtin.command:
    cmd: /usr/sbin/auditctl -l
  register: audit_rules
  changed_when: false
  check_mode: false
  failed_when: false

- name: The human account groups are read
  ansible.builtin.command:
    cmd: id -nG {{ audit_human_user }}
  register: audit_groups
  changed_when: false
  check_mode: false
  failed_when: false
  when: audit_human_user | length > 0

- name: The sudoers grants are read
  ansible.builtin.command:
    cmd: grep -rl NOPASSWD /etc/sudoers /etc/sudoers.d
  register: audit_sudoers
  changed_when: false
  check_mode: false
  failed_when: false

- name: The backup timer state is read
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: systemctl is-active server-backup.timer
  register: audit_backup_timer
  changed_when: false
  check_mode: false
  failed_when: false

- name: The reboot flag is read
  ansible.builtin.stat:
    path: /run/reboot-required
  register: audit_reboot

- name: The account files with a wrong mode are listed
  ansible.builtin.set_fact:
    audit_bad_modes: >-
      {{ (audit_bad_modes | default([]))
         + ([item.item.path] if (item.stat.mode != item.item.mode
                                 or item.stat.pw_name != item.item.owner
                                 or item.stat.gr_name != item.item.group) else []) }}
  loop: "{{ audit_account_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: The observed values are extracted
  ansible.builtin.set_fact:
    audit_ssh_port: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^port (.*)$') | first | default('') }}
    audit_ssh_passwordauth: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^passwordauthentication (.*)$')
         | first | default('') }}
    audit_ssh_rootlogin: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^permitrootlogin (.*)$')
         | first | default('') }}
    audit_ssh_usepam: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^usepam (.*)$')
         | first | default('') }}
    audit_pam_auth: "{{ (audit_pam_files.results[0].content | default('')) | b64decode }}"
    audit_pam_password: "{{ (audit_pam_files.results[1].content | default('')) | b64decode }}"
    audit_pwquality: "{{ (audit_pam_files.results[2].content | default('')) | b64decode }}"
    audit_audit_enabled: "{{ audit_daemon.stdout | regex_findall('(?m)^enabled ([0-9])$') | first | default('0') }}"
    audit_audit_rule_count: "{{ audit_rules.stdout_lines | length }}"
    audit_sysctl_values: "{{ audit_sysctl.stdout_lines }}"
    # The interface values: the kernel uses the maximum of `all` and the
    # interface, so every line must be 1. A line that is not `= 1` names the
    # interface that defeated `all`.
    audit_rp_filter_bad: >-
      {{ audit_rp_filter.stdout_lines | default([])
         | reject('search', '= 1$') | list }}
    audit_io_uring: "{{ audit_sysctl.stdout_lines[3] | default('') }}"
    audit_ipv6_all: "{{ (audit_ipv6.stdout | default('')).split()[0] | default('') }}"
    audit_ipv6_default: "{{ (audit_ipv6.stdout | default('')).split()[1] | default('') }}"
    audit_ipv6_listeners: >-
      {{ audit_listeners.stdout_lines | default([])
         | select('search', '\[::\]') | list }}
    audit_ipv6_reachable: >-
      {{ (audit_ipv6_reach.stdout | default('') | trim | length) > 0 }}
    audit_microcode_revision: >-
      {{ audit_microcode.stdout | default('')
         | regex_findall('(?m)^microcode\s*:\s*(\S+)') | first | default('') }}
    audit_tsa: >-
      {{ audit_microcode.stdout_lines | default([])
         | reject('search', '^microcode') | first | default('') }}
    audit_initramfs_has_microcode: >-
      {{ 'kernel/x86/microcode/' in (audit_initramfs.stdout | default('')) }}
    audit_audit_events: >-
      {{ audit_trail.stdout | default('')
         | regex_findall('(?m)^Number of events:\s*([0-9]+)') | first | default('0') }}
    audit_nft_active: "{{ audit_nft_service.stdout_lines[0] | default('') }}"
    audit_nft_failsafe: >-
      {{ 'server-failsafe' in (audit_nft_service.stdout | default('')) }}
    audit_manifest_ok: "{{ (audit_manifest.rc | default(1)) == 0 }}"
    audit_requiredrsasize: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^requiredrsasize (.*)$')
         | first | default('') }}
    audit_compression: >-
      {{ audit_sshd.stdout | regex_findall('(?m)^compression (.*)$')
         | first | default('') }}
    audit_vconsole_exists: "{{ audit_vconsole_content.rc | default(1) == 0 }}"
    # Read from the source, not from `audit_pwquality`: a value set in this same
    # `set_fact` is not visible to its siblings.
    audit_pwquality_minlen: >-
      {{ (audit_pam_files.results[2].content | default('') | b64decode)
         | regex_findall('(?m)^minlen\s*=\s*([0-9]+)')
         | first | default('0') }}
    audit_forbidden_found: >-
      {{ (audit_groups.stdout | default('')).split()
         | intersect(audit_forbidden_groups) | list }}
    audit_sudoers_unnamed: >-
      {{ audit_sudoers.stdout_lines | default([]) | map('basename') | list
         | difference(audit_sudoers_keep) }}
    audit_login_defs: "{{ (audit_pam_files.results[3].content | default('')) | b64decode }}"
    audit_env_file: "{{ (audit_pam_files.results[4].content | default('')) | b64decode }}"
    audit_inactive: >-
      {{ (audit_shadow.stdout | default('')).split(':')[6] | default('')
         if audit_human_user | length > 0 else '' }}
    audit_umask_value: >-
      {{ (audit_pam_files.results[3].content | default('') | b64decode)
         | regex_findall('(?m)^UMASK\s+(\S+)') | first | default('') }}
    audit_timeout: >-
      {{ (audit_pam_files.results[4].content | default('') | b64decode)
         | regex_findall('(?m)^TMOUT=([0-9]+)') | first | default('0') }}
    audit_legacy_installed: >-
      {{ ansible_facts.packages.keys() | list | intersect(audit_legacy_packages) }}
    audit_suid_unowned: >-
      {{ audit_suid_owner.results | default([]) | selectattr('rc', 'ne', 0)
         | map(attribute='item') | difference(audit_suid_allowlist) | list }}
    audit_forbidden_observed: >-
      {{ (audit_groups.stdout | default('')) if audit_human_user | length > 0
         else 'no human account declared' }}

- name: The controls are evaluated
  ansible.builtin.set_fact:
    audit_results: >-
      {{ [
        {'id': 'SSH-01', 'expected': 'port ' ~ audit_expected_ssh_port,
         'observed': 'port ' ~ audit_ssh_port,
         'result': 'pass' if audit_ssh_port == (audit_expected_ssh_port | string) else 'fail'},
        {'id': 'SSH-02', 'expected': 'passwordauthentication no',
         'observed': 'passwordauthentication ' ~ audit_ssh_passwordauth,
         'result': 'pass' if audit_ssh_passwordauth == 'no' else 'fail'},
        {'id': 'SSH-03', 'expected': 'permitrootlogin no',
         'observed': 'permitrootlogin ' ~ audit_ssh_rootlogin,
         'result': 'pass' if audit_ssh_rootlogin == 'no' else 'fail'},
        {'id': 'SSH-04', 'expected': 'usepam yes',
         'observed': 'usepam ' ~ audit_ssh_usepam,
         'result': 'pass' if audit_ssh_usepam == 'yes' else 'fail'},
        {'id': 'PAM-01', 'expected': 'no nullok in common-auth',
         'observed': 'nullok present' if 'nullok' in audit_pam_auth else 'no nullok',
         'result': 'fail' if 'nullok' in audit_pam_auth else 'pass'},
        {'id': 'PAM-02', 'expected': 'pam_pwhistory in common-password',
         'observed': 'present' if 'pam_pwhistory' in audit_pam_password else 'absent',
         'result': 'pass' if 'pam_pwhistory' in audit_pam_password else 'fail'},
        {'id': 'PWD-01', 'expected': 'minlen >= ' ~ audit_expected_password_min_length,
         'observed': 'minlen ' ~ audit_pwquality_minlen,
         'result': 'pass' if (audit_pwquality_minlen | int) >= audit_expected_password_min_length else 'fail'},
        {'id': 'KRN-01', 'expected': 'every interface rp_filter 1',
         'observed': ('every interface 1'
                      if (audit_rp_filter_bad | length == 0
                          and (audit_rp_filter.stdout_lines | default([]) | length > 0))
                      else (audit_rp_filter_bad | join(', ')
                            if audit_rp_filter_bad | length > 0
                            else 'no interface read')),
         'result': 'pass' if (audit_rp_filter_bad | length == 0
                              and (audit_rp_filter.stdout_lines | default([]) | length > 0))
                   else 'fail'},
        {'id': 'KRN-02', 'expected': 'kptr_restrict >= 1',
         'observed': 'kptr_restrict ' ~ (audit_sysctl_values[0] | default('')),
         'result': 'pass' if ((audit_sysctl_values[0] | default('0')) | int) >= 1 else 'fail'},
        {'id': 'KRN-03', 'expected': 'ptrace_scope >= 1',
         'observed': 'ptrace_scope ' ~ (audit_sysctl_values[1] | default('')),
         'result': 'pass' if ((audit_sysctl_values[1] | default('0')) | int) >= 1 else 'fail'},
        {'id': 'NET-01', 'expected': 'nftables input policy drop',
         'observed': 'policy drop' if 'policy drop' in audit_nft.stdout else 'no drop policy',
         'result': 'pass' if ('chain input' in audit_nft.stdout and 'policy drop' in audit_nft.stdout) else 'fail'},
        {'id': 'AUD-01', 'expected': 'audit enabled',
         'observed': 'enabled ' ~ audit_audit_enabled,
         'result': 'pass' if audit_audit_enabled == '1' else 'fail'},
        {'id': 'AUD-02', 'expected': 'at least 10 audit rules',
         'observed': audit_audit_rule_count ~ ' rules',
         'result': 'pass' if (audit_audit_rule_count | int) >= 10 else 'fail'},
        {'id': 'AUD-03', 'expected': 'audit=1 on the kernel command line',
         'observed': 'present' if 'audit=1' in audit_cmdline.stdout else 'absent',
         'result': 'pass' if 'audit=1' in audit_cmdline.stdout else 'fail'},
        {'id': 'CIS-01', 'expected': 'coredump Storage=none',
         'observed': 'Storage=none' if 'Storage=none' in audit_coredump.stdout else 'storage enabled',
         'result': 'pass' if 'Storage=none' in audit_coredump.stdout else 'fail'},
        {'id': 'CIS-02', 'expected': 'TMOUT=' ~ audit_expected_timeout,
         'observed': 'TMOUT=' ~ audit_timeout,
         'result': 'pass' if audit_timeout == (audit_expected_timeout | string) else 'fail'},
        {'id': 'CIS-03', 'expected': 'account inactivity ' ~ audit_expected_inactive,
         'observed': ('no human account' if audit_human_user | length == 0
                      else 'shadow inactivity ' ~ audit_inactive),
         'result': 'pass' if ((audit_human_user | length == 0)
                              or audit_inactive == (audit_expected_inactive | string))
                   else 'fail'},
        {'id': 'CIS-04', 'expected': 'UMASK ' ~ audit_expected_umask,
         'observed': 'UMASK ' ~ audit_umask_value,
         'result': 'pass' if audit_umask_value == audit_expected_umask else 'fail'},
        {'id': 'KRN-04', 'expected': 'default.log_martians 1',
         'observed': 'default.log_martians ' ~ (audit_sysctl_values[2] | default('')),
         'result': 'pass' if (audit_sysctl_values[2] | default('')) == '1' else 'fail'},
        {'id': 'CIS-05', 'expected': 'no legacy client package',
         'observed': (audit_legacy_installed | join(', ')) if audit_legacy_installed | length > 0 else 'none',
         'result': 'pass' if (audit_legacy_installed | length) == 0 else 'fail'},
        {'id': 'CIS-06', 'expected': 'account file modes',
         'observed': (audit_bad_modes | join(', ')) if audit_bad_modes | length > 0 else 'correct',
         'result': 'pass' if (audit_bad_modes | length) == 0 else 'fail'},
        {'id': 'SUID-01', 'expected': 'no unowned setuid/setgid file',
         'observed': (audit_suid_unowned | join(', ')) if audit_suid_unowned | length > 0
                     else ('none (' ~ audit_suid_scope ~ ')'),
         'result': 'pass' if (audit_suid_unowned | length) == 0 else 'fail'},
        {'id': 'SUDO-01', 'expected': 'no undeclared NOPASSWD drop-in',
         'observed': (audit_sudoers_unnamed | join(', ')) if audit_sudoers_unnamed | length > 0 else 'none',
         'result': 'pass' if (audit_sudoers_unnamed | length) == 0 else 'fail'},
        {'id': 'ACC-01', 'expected': 'no forbidden group',
         'observed': audit_forbidden_observed,
         'result': 'pass' if (audit_human_user | length == 0)
                   or (audit_forbidden_found | length == 0) else 'fail'},
        {'id': 'BKP-01', 'expected': 'server-backup.timer active',
         'observed': audit_backup_timer.stdout | default('inactive'),
         'result': 'pass' if (audit_backup_timer.stdout | default('')) == 'active' else 'fail'},
        {'id': 'SYS-01', 'expected': 'no reboot required',
         'observed': 'reboot required' if audit_reboot.stat.exists else 'no reboot required',
         'result': 'fail' if audit_reboot.stat.exists else 'pass'},
        {'id': 'KRN-05', 'expected': 'io_uring_disabled 2',
         'observed': 'io_uring_disabled ' ~ audit_io_uring,
         'result': 'pass' if audit_io_uring == '2' else 'fail'},
        {'id': 'KRN-06', 'expected': ('IPv6 disabled' if audit_expected_ipv6_disabled | bool
                                      else 'IPv6 enabled by declaration'),
         'observed': ('disable_ipv6 all=' ~ audit_ipv6_all
                      ~ ' default=' ~ audit_ipv6_default
                      ~ '; global address or route='
                      ~ ('present' if audit_ipv6_reachable | bool else 'none')
                      ~ '; wildcard IPv6 listeners=' ~ (audit_ipv6_listeners | length)),
         'result': 'pass' if ((audit_expected_ipv6_disabled | bool
                               and audit_ipv6_all == '1'
                               and audit_ipv6_default == '1'
                               and not (audit_ipv6_reachable | bool))
                              or ((not (audit_expected_ipv6_disabled | bool))
                                  and audit_ipv6_all == '0')) else 'fail'},
        {'id': 'CPU-01', 'expected': ('microcode loaded and present in the initramfs'
                                      if audit_expected_microcode | bool
                                      else 'microcode declined by declaration'),
         'observed': ('microcode ' ~ (audit_microcode_revision | default('absent'))
                      ~ '; initramfs '
                      ~ ('has the blob' if audit_initramfs_has_microcode | bool else 'has no blob')
                      ~ ('; tsa: ' ~ audit_tsa if audit_tsa | length > 0 else '')),
         'result': 'pass' if ((not (audit_expected_microcode | bool))
                              or ((audit_microcode_revision | default('0')) not in ['', '0']
                                  and audit_initramfs_has_microcode | bool)) else 'fail'},
        {'id': 'NET-02', 'expected': 'nftables active, product table loaded, no failsafe',
         'observed': ('nftables ' ~ (audit_nft_active | default(''))
                      ~ '; product table '
                      ~ ('present'
                         if ('table inet ' ~ (security_firewall_table | default('server')))
                            in audit_nft.stdout
                         else 'absent')
                      ~ '; failsafe '
                      ~ ('present' if audit_nft_failsafe | bool else 'absent')),
         'result': 'pass' if (audit_nft_active == 'active'
                              and not (audit_nft_failsafe | bool)
                              and (('table inet '
                                    ~ (security_firewall_table | default('server')))
                                   in audit_nft.stdout))
                   else 'fail'},
        {'id': 'AUD-04', 'expected': 'audit events in the trail',
         'observed': audit_audit_events ~ ' events',
         'result': 'pass' if (audit_audit_events | int) > 0 else 'fail'},
        {'id': 'INT-01', 'expected': 'product-owned files match the manifest',
         'observed': ('all files match' if audit_manifest_ok | bool
                      else ((audit_manifest.stdout_lines | default([])
                             | select('search', 'Échec|FAILED|ne correspond')
                             | list | join(', '))
                            or (audit_manifest.stderr | default('manifest missing or unreadable')))),
         'result': 'pass' if audit_manifest_ok | bool else 'fail'},
        {'id': 'SSH-05', 'expected': 'requiredrsasize >= ' ~ audit_expected_requiredrsasize,
         'observed': 'requiredrsasize ' ~ audit_requiredrsasize,
         'result': 'pass' if ((audit_requiredrsasize | int) >= (audit_expected_requiredrsasize | int)) else 'fail'},
        {'id': 'SSH-06', 'expected': 'compression ' ~ audit_expected_compression,
         'observed': 'compression ' ~ audit_compression,
         'result': 'pass' if audit_compression == (audit_expected_compression | string) else 'fail'},
        {'id': 'CON-01', 'expected': 'no /etc/vconsole.conf (console-setup owns the console)',
         'observed': 'present' if audit_vconsole_exists | bool else 'absent',
         'result': 'fail' if audit_vconsole_exists | bool else 'pass'}
      ] }}

- name: The report directory exists
  ansible.builtin.file:
    path: "{{ audit_report_dir }}"
    state: directory
    owner: root
    group: "{{ audit_report_dir_group }}"
    mode: "{{ audit_report_dir_mode }}"

- name: The report is written
  ansible.builtin.copy:
    content: "{{ audit_results | to_nice_json }}\n"
    dest: "{{ audit_report_file }}"
    owner: root
    group: "{{ audit_report_file_group }}"
    mode: "{{ audit_report_file_mode }}"

- name: The failed controls are counted
  ansible.builtin.set_fact:
    audit_failures: "{{ audit_results | selectattr('result', 'equalto', 'fail') | list }}"

- name: The audit is summarised
  ansible.builtin.debug:
    msg: >-
      audit: {{ audit_results | length }} controls,
      {{ audit_failures | length }} failed;
      report {{ audit_report_file }}

- name: The audit fails on a deviation
  ansible.builtin.assert:
    that:
      - audit_failures | length == 0
    fail_msg: >-
      {{ inventory_hostname }}:
      {{ audit_failures | map(attribute='id') | join(', ') }} failed.
      Report: {{ audit_report_file }}
  when: audit_fail_on_deviation | bool
