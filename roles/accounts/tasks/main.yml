---
- name: The human account is declared
  # The product creates no account and names none by default: a site that forgets
  # the name must fail here, with a sentence, before any task acts on an empty
  # string.
  ansible.builtin.assert:
    that:
      - accounts_human.name | length > 0
    fail_msg: >-
      accounts_human.name is empty. The product creates no account: name the
      existing human account, usually the account named by `ansible_user`.

- name: The declared password lifetime is plausible
  ansible.builtin.assert:
    that:
      - >-
        accounts_human.password_expiry | default('never') | string
        is match('^(never|[0-9]+)$')
    fail_msg: >-
      accounts_human.password_expiry must be `never` or a number of days.

# `append: false`: the declared list IS the list. With `append: true` a
# privileged group the host already carried (docker, lxd, libvirt, disk) survived
# every converge, and a converted machine kept an escalation path nobody declared.
- name: The human account is in its declared groups
  ansible.builtin.user:
    name: "{{ accounts_human.name }}"
    groups: "{{ accounts_human.groups }}"
    append: false
    state: present

- name: The human account's groups are read back
  ansible.builtin.command:
    cmd: id -nG {{ accounts_human.name }}
  register: accounts_groups_live
  changed_when: false
  when: not ansible_check_mode

- name: The human account's primary group is read back
  ansible.builtin.command:
    cmd: id -gn {{ accounts_human.name }}
  register: accounts_primary_group
  changed_when: false
  when: not ansible_check_mode

- name: The human account holds no undeclared group
  ansible.builtin.assert:
    that:
      - >-
        accounts_groups_live.stdout.split()
        is subset(accounts_human.groups
                  + [accounts_primary_group.stdout | trim])
    fail_msg: >-
      {{ inventory_hostname }}: {{ accounts_human.name }} holds
      `{{ accounts_groups_live.stdout }}`, which is not the declared list.
  when: not ansible_check_mode

# The human account is the only account, so the blanket grant it may hold lives in
# `/etc/sudoers`; the legacy lab file would be a second, undeclared path — and this
# is exactly the file the audit called stop-the-line.
- name: No human account keeps an inherited blanket grant
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/90-lab

# --- the bootstrap password does not survive the first login ------------------
#
# The expiry runs in `post_tasks` (`expire.yml`), never here: expiring the
# password mid-play makes sudo ask for a NEW password on the next task, and a
# password-based become loses the connection (measured on server-01-testing,
# 2026-11-18: "Timeout waiting for privilege escalation response: Changement du
# mot de passe"). The play imports `accounts` with `tasks_from: expire.yml`
# after every other role, then re-runs `integrity` so the baseline includes the
# marker the expiry writes.

# --- the human account's password never expires on its own --------------------

# `chage -M` is the PER-ACCOUNT setting and it wins over `/etc/login.defs`. The
# `security` role sets the default; this task makes the account's own value
# true, which matters on a host that already exists: a site that had 365 there
# would otherwise keep it until someone ran `chage` by hand.
#
# The maximum age is SHADOW's fifth field. Reading it first is what makes
# `changed_when` truthful: running `chage -M` unconditionally would report a
# change on every converge, and claiming `changed_when: false` would hide a real
# edit. The read is allowed in check mode; the write is not.
- name: The human account's password-aging state is read
  ansible.builtin.command:
    cmd: "getent shadow {{ accounts_human.name }}"
  register: accounts_shadow_aging
  changed_when: false
  check_mode: false
  failed_when: false

- name: The declared maximum password age is known
  ansible.builtin.set_fact:
    accounts_password_max_days: >-
      {{ 99999 if (accounts_human.password_expiry | default('never') | string == 'never')
         else (accounts_human.password_expiry | int) }}

- name: The human account's password expiry is declared
  ansible.builtin.command:
    cmd: "chage -M {{ accounts_password_max_days }} {{ accounts_human.name }}"
  register: accounts_password_age
  changed_when: true
  when:
    - not ansible_check_mode
    - >-
      (accounts_shadow_aging.stdout | default('') | split(':') | length < 5)
      or (((accounts_shadow_aging.stdout | split(':'))[4] | int)
          != (accounts_password_max_days | int))

- name: The password expiry was accepted
  ansible.builtin.assert:
    that:
      - accounts_password_age.rc | default(0) == 0
    fail_msg: >-
      {{ inventory_hostname }}: `chage -M` failed for {{ accounts_human.name }}
      (rc {{ accounts_password_age.rc | default('?') }}). The value must be
      `never` or a number of days.
  when: not (accounts_password_age.skipped | default(false))
