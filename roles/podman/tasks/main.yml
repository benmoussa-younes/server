---
# The rootless Podman engine. No container is created or started here.
- name: The rootless Podman engine is configured
  when: podman_enabled | bool
  block:
    - name: The owning account is declared
      ansible.builtin.assert:
        that:
          - podman_user | length > 0
          - podman_user != 'root'
        fail_msg: >-
          podman_user must name an existing non-root account; this role never
          configures the rootful engine.

    - name: The owning account is read
      ansible.builtin.getent:
        database: passwd
        key: "{{ podman_user }}"

    - name: The owning account exists
      ansible.builtin.assert:
        that:
          - podman_user in ansible_facts.getent_passwd
        fail_msg: "{{ podman_user }} does not exist on this host."

    - name: The owning account's UID and home are known
      ansible.builtin.set_fact:
        podman_uid: "{{ ansible_facts.getent_passwd[podman_user][1] }}"
        podman_home: "{{ ansible_facts.getent_passwd[podman_user][4] }}"

    - name: The engine packages are present
      ansible.builtin.apt:
        name: "{{ podman_packages }}"
        state: present
        cache_valid_time: 3600

    - name: The container configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ podman_registries_dir }}"
        - "{{ podman_containers_dir }}"

    - name: The registry search path is declared
      ansible.builtin.template:
        src: registries.conf.j2
        dest: "{{ podman_registries_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the rootless Podman socket

    - name: The rootless engine settings are declared
      ansible.builtin.template:
        src: containers.conf.j2
        dest: "{{ podman_containers_file }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart the rootless Podman socket

    - name: The subordinate UID range is read
      ansible.builtin.command:  # noqa: command-instead-of-module
        argv:
          - grep
          - -E
          - "^{{ podman_user }}:"
          - /etc/subuid
      register: podman_subuid
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The subordinate GID range is read
      ansible.builtin.command:  # noqa: command-instead-of-module
        argv:
          - grep
          - -E
          - "^{{ podman_user }}:"
          - /etc/subgid
      register: podman_subgid
      changed_when: false
      failed_when: false
      check_mode: false

    - name: The subordinate ID ranges are coherent
      ansible.builtin.assert:
        that:
          - (podman_subuid.stdout | length > 0) == (podman_subgid.stdout | length > 0)
        fail_msg: >-
          {{ podman_user }} has only one of /etc/subuid and /etc/subgid. Repair
          the account's subordinate ID ranges before enabling Podman.

    - name: The subordinate ID ranges are declared
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: >-
          usermod
          --add-subuids {{ podman_subuid_start }}-{{ podman_subuid_start + podman_subuid_count - 1 }}
          --add-subgids {{ podman_subuid_start }}-{{ podman_subuid_start + podman_subuid_count - 1 }}
          {{ podman_user }}
      when: podman_subuid.stdout | length == 0
      changed_when: true

    - name: The user manager may run without a login
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: "loginctl enable-linger {{ podman_user }}"
        creates: "/var/lib/systemd/linger/{{ podman_user }}"
      when: podman_linger | bool and not ansible_check_mode

    - name: The user socket has a running user manager
      ansible.builtin.assert:
        that:
          - not (podman_socket_enabled | bool) or (podman_linger | bool)
        fail_msg: >-
          podman_socket_enabled requires podman_linger, so the account's user
          manager exists without an active login.

    - name: The rootless Podman socket is enabled
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user enable --now podman.socket
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_socket_enable
      changed_when: >-
        'Created symlink' in podman_socket_enable.stdout
        or 'Created symlink' in podman_socket_enable.stderr
      retries: 5
      delay: 2
      until: podman_socket_enable.rc == 0
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The rootless engine is read back
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: podman info --format json
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_info
      changed_when: false
      when: podman_verify | bool and not ansible_check_mode

    - name: The engine is rootless
      ansible.builtin.assert:
        that:
          - (podman_info.stdout | from_json).host.security.rootless | bool
        fail_msg: >-
          podman info does not report a rootless engine for {{ podman_user }}.
      when: podman_verify | bool and not ansible_check_mode

    - name: The rootless socket is active
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: systemctl --user is-active podman.socket
      become: true
      become_user: "{{ podman_user }}"
      environment:
        HOME: "{{ podman_home }}"
        USER: "{{ podman_user }}"
        LOGNAME: "{{ podman_user }}"
        XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"
      register: podman_socket_state
      changed_when: false
      failed_when: false
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The rootless socket is running
      ansible.builtin.assert:
        that:
          - podman_socket_state.stdout | trim == 'active'
        fail_msg: "podman.socket is not active for {{ podman_user }}."
      when: podman_socket_enabled | bool and not ansible_check_mode

    - name: The user manager lingers
      ansible.builtin.command:  # noqa: command-instead-of-module
        cmd: "loginctl show-user {{ podman_user }} -p Linger"
      register: podman_linger_state
      changed_when: false
      when: podman_linger | bool and not ansible_check_mode

    - name: The user manager is allowed to linger
      ansible.builtin.assert:
        that:
          - podman_linger_state.stdout | trim == 'Linger=yes'
        fail_msg: "Linger is not enabled for {{ podman_user }}."
      when: podman_linger | bool and not ansible_check_mode
