---
# The machine base, on every machine this product owns.
#
# Thin: it only assembles the roles, in the order they must apply. The network
# switch is detached from the session, so every role that writes to the machine
# must already have what it needs before `network` runs.
- name: The machine base
  hosts: "{{ target | default('all') }}"
  become: true
  # No pre-task touches NetworkManager. It was tried (2026-10-20) and it cut the
  # only link the machine had before the alternative was proved: the host was
  # lost on both its addresses. The `network` role now REFUSES a host that still
  # runs it; the operator disables it once, at the console, before the run.
  roles:
    - role: common
      tags: [common]
    - role: accounts
      tags: [accounts]
    - role: identity
      tags: [identity]
    - role: journald
      tags: [journald]
    - role: keyboard
      tags: [keyboard]
    # The shell comes after `identity` (its banner) and `accounts` (whose
    # account it reads back): it declares what a login meets.
    - role: shell
      tags: [shell]
    - role: hardening
      tags: [hardening]
    # The boot splash comes after `hardening`, which owns `/etc/default/grub` and
    # declares `splash` there; the theme is read back from the initramfs.
    - role: plymouth
      tags: [plymouth]
    # The boot menu's image comes after `hardening` (same file, other key) and
    # is regenerated with `update-grub`.
    - role: branding
      tags: [branding]
    - role: performance
      tags: [performance]
    - role: network
      tags: [network]
    - role: resolver
      tags: [resolver]
    - role: time
      tags: [time]
    # `security` runs after `network`, whose hand-over must finish before the
    # firewall is replaced, and after `time`, which appends its NTP port to
    # `security_extra_services`. `resolver` sits before it so the stub is
    # declared when the firewall closes. In `verify` mode the hand-over is a
    # read and this role runs immediately.
    - role: security
      tags: [security]
    # The cryptographic policy comes LAST among the sshd writers: `security`
    # declares the policy, this role declares the algorithms, and its
    # `sshd -T` assertion must see every drop-in in place.
    - role: crypto
      tags: [crypto]
    - role: backup
      tags: [backup]
    # The integrity baseline comes last: it records what every role above wrote
    # outside a package, and the read-only audit verifies it afterwards.
    - role: integrity
      tags: [integrity]

  post_tasks:
    # The bootstrap password is retired ONCE, after every role. Any task after
    # `chage -d 0` would have to answer a password-change prompt for sudo, and a
    # password-based become loses the connection there (measured on
    # server-01-testing, 2026-11-18).
    - name: The bootstrap password is retired after every role
      ansible.builtin.import_role:
        name: accounts
        tasks_from: expire.yml
      tags: [accounts]

    # The integrity baseline is taken after the last file the product writes --
    # the expiry marker -- so the audit's manifest matches the host.
    - name: The baseline includes the last write
      ansible.builtin.import_role:
        name: integrity
      tags: [integrity]
