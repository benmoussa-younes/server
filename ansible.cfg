[defaults]
inventory = inventories/example/hosts.yml
roles_path = roles
collections_path = .ansible/collections
retry_files_enabled = False
host_key_checking = True
# The `yaml` callback shortcut resolved to community.general.yaml, which is
# deprecated; the builtin callback with `result_format` is the supported form.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become_ask_pass = False

[ssh_connection]
# A single SSH command per task instead of several round trips. Debian's sudo
# does not require a tty, which is the condition for pipelining to work.
pipelining = True
