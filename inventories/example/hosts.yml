---
# An example inventory: DOCUMENTATION VALUES ONLY (RFC 5737 TEST-NET-1).
#
# No real machine, address, domain or secret lives here. Copy the whole
# directory to `inventories/<site>/`, replace the values, create the vault
# described in `group_vars/all/vault.yml.example`, and follow
# `README.md`. The example itself is never converged.
all:
  vars:
    ansible_connection: ssh
    # The account the Debian installer created. Replace it with the site's
    # bootstrap account, and make `accounts_human.name` match it below.
    ansible_user: debian
    ansible_python_interpreter: /usr/bin/python3

    # The product identity. A site may replace the displayed name and the legal
    # texts; the paths and systemd unit names stay `server-*`.
    identity_product: server
    identity_home_url: ""
    identity_support_url: ""
    identity_bug_report_url: ""
    # Optional: leave empty to keep the name the Debian installer set.
    identity_hostname: ""

    # The human account is the only account the product keeps: it escalates with
    # a password, and no root-equivalent automation account exists.
    accounts_human:
      name: "{{ ansible_user }}"
      groups:
        - sudo
        - adm
        - systemd-journal
      password_expiry: never
    # The installer account already holds the operator's password.
    accounts_expire_bootstrap_password: false

    # The link. `verify` reads the state and writes the declaration; it never
    # moves the link the first run is using. A console hand-over is a separate
    # decision (the console note in `README.md`).
    network_mode: static
    network_address: "192.0.2.10"
    network_prefix: "24"
    network_gateway: "192.0.2.1"
    network_dns: ["192.0.2.53"]
    network_domain: "example.test"
    network_apply: verify

    # The firewall and sshd. An empty source list is refused, not interpreted.
    security_ssh_sources:
      - 192.0.2.0/24
    security_sshd_allow_groups:
      - sudo

    # A client must declare where it takes its time. This is the distribution's
    # pool, declared explicitly; a site with its own time servers names them.
    time_serve: false
    time_timezone: Etc/UTC
    time_servers: []
    time_client_fallback_pools:
      - 2.debian.pool.ntp.org

    # The rootless container engine is optional and never starts a container.
    # The owning account defaults to `accounts_human.name`.
    podman_enabled: false
    podman_registries: [docker.io]

    # Site choices, not product defaults. Replace them for the client.
    keyboard_model: pc105
    keyboard_layout: fr
    shell_messages_locale: fr_FR.UTF-8

    # The backup password is not here: `group_vars/all/vars.yml` maps it from
    # the vault, so no secret can be committed by copying this file.

  children:
    servers:
      hosts:
        # A wired, static host.
        example-server-01:
          ansible_host: 192.0.2.10
        # A second wired host, on DHCP.
        example-server-02:
          ansible_host: 192.0.2.11
          network_mode: dhcp
          network_apply: verify
